run_name: llm-7b-pretrain-v1
seed: 42
output_dir: /kaggle/working/checkpoints/llm-7b
cache_dir: /kaggle/working/cache

model:
  vocab_size: 50257
  hidden_size: 1536
  intermediate_size: 4096
  num_hidden_layers: 24
  num_attention_heads: 24
  num_key_value_heads: 6
  max_position_embeddings: 4096
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: false
  use_flash_attn: true
  gradient_checkpointing: true

tokenizer:
  # Use GPT-2 tokenizer (pre-trained, no training needed) - vocab_size=50257
  pretrained_or_path: gpt2
  fallback_tokenizer: gpt2
  train_if_missing: false
  tokenizer_out_dir: /kaggle/working/tokenizer_65k
  vocab_size: 50257
  sample_chars_for_training: 20000000
  # Offline mode: set these if you have local data
  # local_data_dir: /kaggle/input/my-corpus  # directory with .jsonl/.parquet files
  # local_fallback_path: /kaggle/input/my-tokenizer  # local tokenizer directory

data:
  seq_len: 256
  num_workers: 0
  shuffle_buffer: 10000
  sources:
    # Online mode (requires Internet=On) - using reliable public datasets with VERIFIED configs
    - name: c4_en
      dataset_id: allenai/c4
      config_name: en
      split: train
      text_field: text
      weight: 0.60
      streaming: true
    - name: code_parrot
      dataset_id: transformersbook/codeparrot
      config_name: default
      split: train
      text_field: content
      weight: 0.20
      streaming: true
    - name: wikipedia_en
      dataset_id: wikimedia/wikipedia
      config_name: 20231101.en
      split: train
      text_field: text
      weight: 0.10
      streaming: true
    - name: slim_pajama
      dataset_id: cerebras/SlimPajama-627B
      config_name: 
      split: train
      text_field: text
      weight: 0.10
      streaming: true
    # Alternative datasets (uncomment if needed):
    # - name: the_pile
    #   dataset_id: EleutherAI/pile
    #   config_name: null
    #   split: train
    #   text_field: text
    #   weight: 0.30
    #   streaming: true
    # - name: fineweb_edu
    #   dataset_id: HuggingFaceFW/fineweb-edu
    #   config_name: sample-10BT
    #   split: train
    #   text_field: text
    #   weight: 0.50
    #   streaming: true
    # - name: fineweb
    #   dataset_id: HuggingFaceFW/fineweb
    #   config_name: sample-10BT
    #   split: train
    #   text_field: text
    #   weight: 0.30
    #   streaming: true
    # - name: open_web_math
    #   dataset_id: open-web-math/open-web-math
    #   config_name: null
    #   split: train
    #   text_field: text
    #   weight: 0.05
    #   streaming: true
    # Offline mode (uncomment and mount local data as Kaggle input dataset):
    # - name: my_corpus
    #   local_dir: /kaggle/input/my-corpus
    #   weight: 1.0

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 256
  max_steps: 100000
  warmup_steps: 1000
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  max_grad_norm: 1.0
  precision: bf16
  log_interval: 10
  save_interval: 1000
  eval_interval: 1000
  max_checkpoints_to_keep: 3
  max_runtime_seconds: 39600
  resume_from_checkpoint: auto

eval:
  eval_batches: 25
  perplexity_prompts:
    - "In statistical machine learning, cross-entropy loss measures the divergence between"
    - "def binary_search(arr: list[int], target: int) -> int:"
    - "To solve a system of linear equations using Gaussian elimination, we first"
  completion_prompts:
    - "The key difference between grouped-query attention and multi-head attention is"
    - "A concise explanation of gradient checkpointing in deep neural networks:"