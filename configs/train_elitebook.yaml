run_name: llm-50m-elitebook
seed: 42
output_dir: ./checkpoints/llm-50m-elitebook
cache_dir: ./cache

# === MAXIMAL KOMPAKT FÜR i7-6500U + 7.6GB RAM ===
model:
  vocab_size: 50257
  hidden_size: 384
  intermediate_size: 1024
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  max_position_embeddings: 512
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true
  use_flash_attn: false
  gradient_checkpointing: true

tokenizer:
  pretrained_or_path: gpt2
  fallback_tokenizer: gpt2
  train_if_missing: false
  vocab_size: 50257

# Nur EIN Dataset, wenig Buffer, CPU-only
data:
  seq_len: 256
  num_workers: 0
  shuffle_buffer: 1000
  sources:
    - name: c4_en
      dataset_id: allenai/c4
      config_name: en
      split: train
      text_field: text
      weight: 1.0
      streaming: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 128
  max_steps: 15000
  warmup_steps: 500
  learning_rate: 2e-3
  min_lr_ratio: 0.1
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1e-8
  max_grad_norm: 1.0
  precision: fp32
  log_interval: 25
  save_interval: 1000
  eval_interval: 1000
  max_checkpoints_to_keep: 2
  max_runtime_seconds: 86400
  resume_from_checkpoint: auto

eval:
  eval_batches: 5
  completion_prompts:
    - "User: Hello\nAssistant:"
    - "User: What is Python?\nAssistant:"
    - "def hello():"